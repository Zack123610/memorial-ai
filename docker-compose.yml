services:
  redis:
    image: redis:7-alpine
    container_name: memorial-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # The AI pipeline (tts-service, video-service) runs as native FastAPI
  # services rather than containers: both are thin clients over cloud
  # DashScope and are iterated on directly with uv. See each service's
  # README for how to run them.

volumes:
  redis-data:
